<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login - StudentHire</title><link rel="stylesheet" href="css/style.css"><style>
.auth-page{min-height:calc(100vh - 76px);background:#f8fafc;display:flex;align-items:center;justify-content:center;padding:40px}.auth-card{background:#fff;width:420px;padding:35px;border-radius:15px;border:1px solid var(--border);box-shadow:0 15px 40px rgba(0,0,0,.05)}.auth-card h1{font-size:27px;margin-bottom:7px}.auth-card>p{color:#64748b;font-size:13px;margin-bottom:25px}.auth-form label{display:block;font-size:12px;font-weight:600;margin-bottom:6px}.auth-form input{width:100%;padding:12px;border:1px solid var(--border);border-radius:7px;margin-bottom:18px;outline:none}.auth-button{width:100%;border:none;cursor:pointer}.auth-footer{text-align:center;margin-top:20px;color:#64748b;font-size:12px}.auth-footer a{color:var(--primary);font-weight:700}
</style></head><body><header class="navbar"><div class="container nav-content"><a href="index.html" class="logo"><span class="logo-icon">S</span>Student<span>Hire</span></a><a href="register.html" class="btn-primary">Create Account</a></div></header>
<section class="auth-page"><div class="auth-card"><h1>Welcome Back 👋</h1><p>Login to your StudentHire account.</p><form class="auth-form" onsubmit="loginUser(event)"><label>Email Address</label><input type="email" id="loginEmail" placeholder="student@example.com" required><label>Password</label><input type="password" id="loginPassword" placeholder="Enter your password" required><button type="submit" class="btn-primary auth-button">Login</button></form><div class="auth-footer">Don't have an account? <a href="register.html">Create one</a></div></div></section><script src="js/script.js"></script></body></html>
