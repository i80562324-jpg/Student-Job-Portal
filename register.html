<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Account - StudentHire</title><link rel="stylesheet" href="css/style.css"><style>
.auth-page{min-height:calc(100vh - 76px);background:#f8fafc;display:flex;justify-content:center;align-items:center;padding:40px}.auth-card{background:#fff;width:450px;padding:35px;border-radius:15px;border:1px solid var(--border)}.auth-card h1{font-size:27px}.auth-card>p{color:#64748b;font-size:13px;margin:6px 0 25px}.form-group{margin-bottom:16px}.form-group label{display:block;font-size:12px;font-weight:600;margin-bottom:6px}.form-group input,.form-group select{width:100%;padding:11px;border:1px solid var(--border);border-radius:7px}.register-button{width:100%;border:none;cursor:pointer;margin-top:5px}.auth-footer{text-align:center;font-size:12px;color:#64748b;margin-top:20px}.auth-footer a{color:var(--primary);font-weight:700}
</style></head><body><header class="navbar"><div class="container nav-content"><a href="index.html" class="logo"><span class="logo-icon">S</span>Student<span>Hire</span></a><a href="login.html">Login</a></div></header>
<section class="auth-page"><div class="auth-card"><h1>Create Your Account</h1><p>Join StudentHire and discover new opportunities.</p><form onsubmit="registerUser(event)"><div class="form-group"><label>Full Name</label><input type="text" id="registerName" placeholder="Your full name" required></div><div class="form-group"><label>Email Address</label><input type="email" id="registerEmail" placeholder="student@example.com" required></div><div class="form-group"><label>Account Type</label><select><option>Student</option><option>Employer</option></select></div><div class="form-group"><label>Password</label><input type="password" id="registerPassword" placeholder="Create a password" required></div><button type="submit" class="btn-primary register-button">Create Account</button></form><div class="auth-footer">Already have an account? <a href="login.html">Login</a></div></div></section><script src="js/script.js"></script></body></html>
