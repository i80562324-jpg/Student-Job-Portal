<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My Profile - StudentHire</title><link rel="stylesheet" href="css/style.css"><style>
.profile-page{background:#f8fafc;min-height:calc(100vh - 76px);padding:50px 0}.profile-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:30px}.profile-header{display:flex;align-items:center;gap:20px;border-bottom:1px solid var(--border);padding-bottom:25px}.profile-avatar{width:80px;height:80px;border-radius:50%;background:#dbeafe;display:flex;justify-content:center;align-items:center;font-size:35px}.profile-header h1{font-size:25px}.profile-header p{color:#64748b;font-size:13px}.profile-section{margin-top:30px}.profile-section h2{font-size:18px;margin-bottom:20px}.profile-form{display:grid;grid-template-columns:1fr 1fr;gap:18px}.profile-form label{display:block;font-size:12px;font-weight:600;margin-bottom:6px}.profile-form input,.profile-form textarea{width:100%;padding:11px;border:1px solid var(--border);border-radius:7px}.profile-form textarea{min-height:100px}.full{grid-column:1/-1}@media(max-width:700px){.profile-form{grid-template-columns:1fr}}
</style></head><body><header class="navbar"><div class="container nav-content"><a href="index.html" class="logo"><span class="logo-icon">S</span>Student<span>Hire</span></a><a href="student-dashboard.html" class="btn-primary">Dashboard</a></div></header>
<section class="profile-page"><div class="container"><div class="profile-card"><div class="profile-header"><div class="profile-avatar">👨‍🎓</div><div><h1 class="student-name">Student</h1><p>Student · Computer Science</p></div></div><div class="profile-section"><h2>Personal Information</h2><form class="profile-form"><div><label>Full Name</label><input type="text" value="Student"></div><div><label>Email</label><input type="email" value="student@example.com"></div><div><label>University</label><input type="text" placeholder="Your university"></div><div><label>Degree</label><input type="text" placeholder="e.g. BSc Computer Science"></div><div><label>Skills</label><input type="text" placeholder="HTML, CSS, JavaScript..."></div><div><label>Expected Graduation</label><input type="month"></div><div class="full"><label>About Me</label><textarea placeholder="Write something about yourself..."></textarea></div><div><button type="button" class="btn-primary" onclick="showNotification('Profile updated successfully!','success')">Save Changes</button></div></form></div></div></div></section><script src="js/script.js"></script></body></html>
